name: Build TV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk PrathapTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrathapTV-apk
          path: PrathapTV.apk

      # Gives a fixed download link for the TV's Downloader app:
      # https://github.com/<you>/PrathapTV/releases/latest/download/PrathapTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Prathap TV build ${{ github.run_number }}
          files: PrathapTV.apk
          make_latest: true
